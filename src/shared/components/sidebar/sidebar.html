<div class="brand">
  <mat-icon class="brand__icon">cleaning_services</mat-icon>
  <span class="brand__name">{{ appName }}</span>
</div>

<nav class="nav">
  @for (section of sections(); track section.title) {
    <div class="nav__section">
      <p class="nav__title">{{ section.title }}</p>
      @for (item of section.items; track item.path) {
        <a
          class="nav__item"
          [routerLink]="item.path"
          routerLinkActive="nav__item--active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
          @if (item.monitorBadge && attention().total) {
            <span class="nav__badge" [class.nav__badge--red]="attention().red > 0">
              {{ attention().total }}
            </span>
          }
        </a>
      }
    </div>
  }
</nav>

<p class="version" [attr.title]="'Built ' + builtAt">{{ versionLabel }}</p>
