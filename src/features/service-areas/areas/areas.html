<header class="page-head">
  <div>
    <h2 class="page-head__title">Service zones</h2>
    <p class="page-head__sub">
      Coverage zones, pincodes and societies where ClearIt operates
    </p>
  </div>
  <div class="page-head__actions">
    <a matButton="outlined" routerLink="/service-areas/cities">Cities</a>
    <a matButton="outlined" routerLink="/service-areas/pincodes">Pincodes</a>
    <a matButton="outlined" routerLink="/service-areas/societies">Societies</a>
    <button matButton="filled" type="button" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      New zone
    </button>
  </div>
</header>

<div class="filters">
  <mat-form-field class="filters__search">
    <mat-label>Search</mat-label>
    <input
      matInput
      [formControl]="searchControl"
      placeholder="Zone, city, region or pincode"
    />
    <mat-icon matIconPrefix>search</mat-icon>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Status</mat-label>
    <mat-select
      [value]="status()"
      (selectionChange)="onStatusChange($event.value)"
    >
      @for (option of statusOptions; track option.value) {
        <mat-option [value]="option.value">{{ option.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>

<app-data-table
  [columns]="columns"
  [rows]="rows()"
  [actions]="actions"
  [loading]="loading()"
  [total]="total()"
  [page]="page()"
  [limit]="limit()"
  emptyMessage="No service areas match these filters"
  (pageChange)="onPageChange($event)"
  (actionClick)="onAction($event)"
/>
